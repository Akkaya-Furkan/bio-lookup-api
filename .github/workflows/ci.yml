name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bio-lookup-api .
      - name: Run it and hit /health and /docs
        run: |
          docker run -d --name api -p 8000:8000 bio-lookup-api
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health | grep '"status":"ok"'
          curl -fs -o /dev/null -w "docs: %{http_code}\n" http://127.0.0.1:8000/docs
          docker logs api
